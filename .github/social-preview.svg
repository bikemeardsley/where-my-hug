<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#ffd21e"/>
  <image x="92" y="8" width="208" height="208" href="logo.svg" xlink:href="logo.svg"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#111">
    <text x="352" y="84" font-size="72" font-weight="800" letter-spacing="-2">Where My Hug At?</text>
    <g font-size="22" fill="#2a2200">
      <text x="356" y="122">Tell your AI agent what you want a model to do.</text>
      <text x="356" y="150">It finds what already exists on Hugging Face, Kaggle,</text>
      <text x="356" y="178">Zenodo, ModelScope and Roboflow, models and data alike:</text>
      <text x="356" y="206">an exact fit, what to fine-tune, what to train, what's just code.</text>
    </g>
  </g>
  <rect x="64" y="226" width="1152" height="402" rx="18" fill="#fffdf5" transform="rotate(-0.6 640 427)"/>
  <!-- flow.svg cropped to its content (it carries 40px margins of its own) -->
