<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="-12 -4 424 408" role="img" aria-label="Where's My Hug? mascot: a round ink-drawn character with its arms open wide, eyes glancing sideways, waiting for a hug">
  <defs>
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
  </defs>
  <g transform="rotate(-6 200 220)">
    <g filter="url(#ink)" fill="none" stroke="#111" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <!-- body: an egg, a little lopsided -->
      <path d="M200 100 C266 98 306 154 308 224 C310 292 264 336 200 338 C134 340 92 294 92 222 C92 154 136 102 200 100 Z"/>
      <!-- arms open wide, reaching -->
      <path d="M96 238 C70 236 46 226 26 206"/>
      <path d="M304 238 C330 236 354 226 374 206"/>
      <!-- open hands: three short fingers each -->
      <path d="M26 206 L10 196"/>
      <path d="M26 206 L14 214"/>
      <path d="M26 206 L22 190"/>
      <path d="M374 206 L390 196"/>
      <path d="M374 206 L386 214"/>
      <path d="M374 206 L378 190"/>
      <!-- feet -->
      <path d="M170 336 C166 354 152 360 142 358"/>
      <path d="M230 336 C234 354 248 360 258 358"/>
      <!-- eyes: two ovals, looking off to the side -->
      <path d="M150 204 C150 188 182 188 182 204 C182 222 150 222 150 204 Z" stroke-width="8"/>
      <path d="M214 204 C214 188 246 188 246 204 C246 222 214 222 214 204 Z" stroke-width="8"/>
      <!-- brows: one up, one level -->
      <path d="M148 172 C158 166 172 166 182 170"/>
      <path d="M214 162 C224 154 238 154 248 160"/>
      <!-- the question, drawn -->
      <path d="M322 70 C324 52 354 48 358 66 C362 82 342 86 340 102"/>
    </g>
    <g filter="url(#ink)" fill="#111">
      <!-- pupils, slid to the side: where is it? -->
      <circle cx="156" cy="206" r="8"/>
      <circle cx="220" cy="206" r="8"/>
      <!-- mouth: a small asking o -->
      <ellipse cx="196" cy="262" rx="9" ry="11"/>
      <circle cx="340" cy="122" r="7"/>
    </g>
  </g>
  <g filter="url(#ink)" fill="#111">
    <circle cx="62" cy="104" r="4"/>
    <circle cx="368" cy="290" r="3.5"/>
    <circle cx="96" cy="362" r="3"/>
    <circle cx="306" cy="376" r="4"/>
    <circle cx="40" cy="318" r="2.5"/>
  </g>
</svg>
