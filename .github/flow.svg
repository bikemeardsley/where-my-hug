<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="864" height="360" viewBox="0 32 864 360" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">How Where My Hug At? works</title>
<desc id="flow-desc">Your model need, with four questions (compute, license, stack, data), is split into parts. Parts that are just code are marked write and need no search. Find hug searches Hugging Face for every other part four ways: most downloaded, trending, names and card text. From what it found, each part gets its verdict: use, tune or train. Your report checks every pick live and sizes it for your hardware.</desc>
<defs>
<marker id="flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#555555"/></marker>
</defs>
