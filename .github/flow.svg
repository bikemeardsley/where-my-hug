<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="528" viewBox="0 0 1080 528" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">How Where My Hug At? works</title>
<desc id="flow-desc">Your ML need, a model, a dataset or both, with four questions asked first (compute, license, stack, data), is split into parts: jobs with an input and an output. A part to search goes to Find hug, which searches Hugging Face four ways for models and datasets: most downloaded, trending, names and card text. The same search covers the other hubs, for models and datasets too: Kaggle, Zenodo, ModelScope, and Roboflow with your key. What turns up on several hubs is consolidated into one finding that names every hub it's on, so you pick the one you use. The verdict, use, tune or train, comes from those findings. A part that's just code is marked write and needs no search. Your report checks every pick live, sizes it for your hardware, and ends with where to start.</desc>
