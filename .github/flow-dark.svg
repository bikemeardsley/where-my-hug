<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 32 920 360" role="img" aria-labelledby="flow-dark-title flow-dark-desc">
<title id="flow-dark-title">How Where My Hug At? works</title>
<desc id="flow-dark-desc">Your model need, with four questions asked first (compute, license, stack, data), is split into parts: jobs with an input and an output. A part that's a model's job goes to Find hug, which searches Hugging Face four ways: most downloaded, trending, names and card text. Its verdict, use, tune or train, comes from what the search found. A part that's just code is marked write and needs no search. Your report checks every pick live and sizes it for your hardware.</desc>
