<title id="flow-dark-title">How Where My Hug At? works</title>
<desc id="flow-dark-desc">Your model need goes through four questions (compute, license, stack, data) and is split into parts, each marked use, tune, train or write. Find hug searches Hugging Face for every model and dataset the use, tune and train parts name; write parts need no model. Both go into your report.</desc>
