<svg xmlns="http://www.w3.org/2000/svg" width="820" height="200" viewBox="0 0 820 200" role="img" aria-labelledby="flow-dark-title flow-dark-desc">
  <title id="flow-dark-title">How Where's My Hug? works</title>
  <desc id="flow-dark-desc">Your need goes through four questions (compute, license, stack, data), is split into parts each marked use, tune, train or write, every model and dataset is checked live on Hugging Face, and you get the report.</desc>
  <defs>
    <filter id="flow-dark-sketchy" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="flow-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9da7b3"/>
    </marker>
  </defs>

  <g stroke="#9da7b3" stroke-width="1.2" marker-end="url(#flow-dark-arrow)">
    <line x1="152" y1="100" x2="172" y2="100"/>
    <line x1="316" y1="100" x2="336" y2="100"/>
    <line x1="480" y1="100" x2="500" y2="100"/>
    <line x1="644" y1="100" x2="664" y2="100"/>
  </g>

  <g filter="url(#flow-dark-sketchy)" stroke="#f0f6fc" stroke-width="1.6" fill="none">
    <rect x="12" y="40" width="140" height="120" rx="8"/>
    <rect x="176" y="40" width="140" height="120" rx="8"/>
    <rect x="340" y="40" width="140" height="120" rx="8"/>
    <rect x="504" y="40" width="140" height="120" rx="8" fill="#ffd21e" fill-opacity="0.22"/>
    <rect x="668" y="40" width="140" height="120" rx="8"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <g font-size="16" font-weight="600" fill="#f0f6fc">
      <text x="82" y="80">Your need</text>
      <text x="246" y="80">Four questions</text>
      <text x="410" y="80">Split, decide</text>
      <text x="574" y="80">Checked live</text>
      <text x="738" y="80">Your report</text>
    </g>
    <g font-size="12" fill="#9da7b3">
      <text x="82" y="108">"transcribe my</text>
      <text x="82" y="124">recipe cards"</text>
      <text x="246" y="108">compute · license</text>
      <text x="246" y="124">stack · data</text>
      <text x="410" y="108">each part: USE,</text>
      <text x="410" y="124">TUNE, TRAIN, WRITE</text>
      <text x="574" y="104">on Hugging Face:</text>
      <text x="574" y="120">fakes dropped, the</text>
      <text x="574" y="136">rest flagged, sized</text>
      <text x="738" y="108">real models that</text>
      <text x="738" y="124">fit your hardware</text>
    </g>
  </g>
</svg>
