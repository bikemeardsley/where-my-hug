<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="528" viewBox="0 0 920 528" role="img" aria-labelledby="flow-dark-title flow-dark-desc">
<title id="flow-dark-title">How Where My Hug At? works</title>
<desc id="flow-dark-desc">Your model need, with four questions asked first (compute, license, stack, data), is split into parts: jobs with an input and an output. A part that's a model's job goes to Find hug, which searches Hugging Face four ways: most downloaded, trending, names and card text. The same search looks for datasets on other hubs: Kaggle, Zenodo, ModelScope, and Roboflow with your key. The verdict, use, tune or train, comes from what both found. A part that's just code is marked write and needs no search. Your report checks every pick live, sizes it for your hardware, and ends with where to start.</desc>
