<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-label="A conversation: you ask where's my hug at for transcribing handwritten recipe cards; the agent asks four things first (compute, license, stack, data); you answer; it returns a report checked on Hugging Face: USE Qwen2.5-VL-7B to read the card, TUNE Qwen2.5-VL-3B on IAM for hard handwriting, WRITE your own code to parse the amounts.">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .who { font-size: 13px; fill: #8b949e; }
    .you { font-size: 17px; fill: #f0f6fc; }
    .agent { font-size: 16px; fill: #c9d1d9; }
    .chip-title { font-size: 15px; font-weight: 600; fill: #ffd21e; }
    .chip-sub { font-size: 13px; fill: #8b949e; }
    .part { font-size: 15px; fill: #f0f6fc; }
    .pick { font-size: 13.5px; fill: #c9d1d9; }
    .verdict { font-size: 12px; font-weight: 700; }
    .note { font-size: 13px; fill: #8b949e; }
  </style>
  <rect x="0.5" y="0.5" width="879" height="519" rx="14" fill="#0d1117" stroke="#30363d"/>
  <circle cx="26" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="22" r="6" fill="#febc2e"/>
  <circle cx="66" cy="22" r="6" fill="#28c840"/>
  <text x="440" y="27" text-anchor="middle" class="sans note">your agent, with Where's My Hug?</text>
  <line x1="0" y1="44" x2="880" y2="44" stroke="#30363d"/>

  <text x="32" y="86" class="mono who">you</text>
  <text x="100" y="86" class="sans you">Where's my hug at for transcribing handwritten recipe cards?</text>

  <text x="32" y="132" class="mono who">agent</text>
  <text x="100" y="132" class="sans agent">Before any search, four things change the answer:</text>
  <g class="sans">
    <rect x="100" y="148" width="178" height="58" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="116" y="172" class="chip-title">Compute</text>
    <text x="116" y="192" class="chip-sub">where it runs and trains</text>
    <rect x="290" y="148" width="178" height="58" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="306" y="172" class="chip-title">License</text>
    <text x="306" y="192" class="chip-sub">what it may be used for</text>
    <rect x="480" y="148" width="178" height="58" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="496" y="172" class="chip-title">Stack</text>
    <text x="496" y="192" class="chip-sub">what calls the model</text>
    <rect x="670" y="148" width="178" height="58" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="686" y="172" class="chip-title">Data</text>
    <text x="686" y="192" class="chip-sub">what there is to train on</text>
  </g>

  <text x="32" y="250" class="mono who">you</text>
  <text x="100" y="250" class="sans you">One 24 GB GPU · personal use · a Python script · a shoebox of cards</text>

  <text x="32" y="296" class="mono who">agent</text>
  <text x="100" y="296" class="sans agent"><tspan fill="#3fb950">✓</tspan> Checked on Hugging Face just now: 5 named, all there.</text>

  <rect x="100" y="314" width="748" height="148" rx="10" fill="#161b22" stroke="#30363d"/>
  <g class="sans">
    <rect x="118" y="332" width="64" height="24" rx="5" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950"/>
    <text x="150" y="349" text-anchor="middle" class="verdict" fill="#3fb950">USE</text>
    <text x="200" y="349" class="part">Read the card</text>
    <text x="380" y="349" class="mono pick">Qwen/Qwen2.5-VL-7B-Instruct</text>
    <text x="830" y="349" text-anchor="end" class="note">fits · apache-2.0</text>

    <rect x="118" y="376" width="64" height="24" rx="5" fill="#d29922" fill-opacity="0.15" stroke="#d29922"/>
    <text x="150" y="393" text-anchor="middle" class="verdict" fill="#d29922">TUNE</text>
    <text x="200" y="393" class="part">Read the hard hands</text>
    <text x="380" y="393" class="mono pick">Qwen2.5-VL-3B + Teklia/IAM-line</text>
    <text x="830" y="393" text-anchor="end" class="note">research-only terms</text>

    <rect x="118" y="420" width="64" height="24" rx="5" fill="#a371f7" fill-opacity="0.15" stroke="#a371f7"/>
    <text x="150" y="437" text-anchor="middle" class="verdict" fill="#a371f7">WRITE</text>
    <text x="200" y="437" class="part">Parse the amounts</text>
    <text x="380" y="437" class="mono pick">your code</text>
    <text x="830" y="437" text-anchor="end" class="note">no model needed</text>
  </g>

  <text x="440" y="494" text-anchor="middle" class="sans note">Every model and dataset it names is looked up live: license, size, gating, downloads, freshness.</text>
</svg>
